<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Open</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #000C3C;
            --court-color: #0091D2;
            --navbar-height: 52px;
            --court-spacing: clamp(12px, 3vw, 24px);
        }

        body.theme-australian { --bg-color: #000C3C; --court-color: #0091D2; }
        body.theme-french     { --bg-color: #1A4D2E; --court-color: #C2593F; }
        body.theme-wimbledon  { --bg-color: #3D2358; --court-color: #21713C; }
        body.theme-usopen     { --bg-color: #355E3B; --court-color: #1E8FD5; }

        body {
            background-color: var(--bg-color);
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
            padding: calc((var(--court-spacing) * 2) + var(--navbar-height)) var(--court-spacing) var(--court-spacing);
        }

        .navbar {
            position: fixed;
            top: var(--court-spacing);
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: fit-content;
            max-width: calc(100% - (var(--court-spacing) * 2));
            height: var(--navbar-height);
            padding: 4px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .nav-links {
            position: relative;
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            height: 100%;
            border-radius: inherit;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-links::-webkit-scrollbar { display: none; }

        .nav-bubble {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 9999px;
            pointer-events: none;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        .nav-links li {
            height: 100%;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 1;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-radius: 9999px;
            transition: color 0.25s ease, background 0.25s ease;
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-links a.active {
            color: #fff;
            background: transparent;
        }

        .court-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--court-spacing);
            container-type: inline-size;
        }

        .court {
            width: 100%;
            aspect-ratio: 78 / 36;
            position: relative;
            background-color: var(--court-color);
            transition: background-color 0.4s ease;
            --line-thickness: clamp(1.5px, 0.35cqi, 3px);
            border: var(--line-thickness) solid #fff;
        }

        .court::before, .court::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: var(--line-thickness);
            background-color: #fff;
            z-index: 1;
        }
        .court::before { top: 12.5%; }
        .court::after  { bottom: 12.5%; }

        .inner-court {
            position: absolute;
            inset: 12.5% 0;
        }

        .service-line-left, .service-line-right {
            position: absolute;
            top: 0; bottom: 0;
            width: var(--line-thickness);
            background-color: #fff;
            z-index: 2;
        }
        .service-line-left  { left: 23.0769%; }
        .service-line-right { right: 23.0769%; }

        .center-service-line {
            position: absolute;
            top: 50%;
            left: 23.0769%;
            right: 23.0769%;
            height: var(--line-thickness);
            background-color: #fff;
            transform: translateY(-50%);
            z-index: 2;
        }

        .net {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            width: var(--line-thickness);
            background-color: rgba(255, 255, 255, 0.5);
            transform: translateX(-50%);
            z-index: 3;
        }

        .hash-left, .hash-right {
            position: absolute;
            top: 50%;
            width: max(0.427cqi, 4px);
            height: var(--line-thickness);
            background-color: #fff;
            transform: translateY(-50%);
            z-index: 2;
        }
        .hash-left  { left: 0; }
        .hash-right { right: 0; }
    </style>
</head>
<body class="theme-australian">

    <nav class="navbar">
        <ul class="nav-links">
            <div class="nav-bubble" id="navBubble"></div>
            <li><a href="#" data-theme="theme-australian" class="active">Australian Open</a></li>
            <li><a href="#" data-theme="theme-french">French Open</a></li>
            <li><a href="#" data-theme="theme-wimbledon">Wimbledon</a></li>
            <li><a href="#" data-theme="theme-usopen">US Open</a></li>
        </ul>
    </nav>

    <div class="court-container">
        <script>
            document.write(`
                <div class="court"><div class="inner-court"><div class="service-line-left"></div><div class="service-line-right"></div><div class="center-service-line"></div></div><div class="net"></div><div class="hash-left"></div><div class="hash-right"></div></div>
            `.repeat(10));
        </script>
    </div>

    <script>
        const navLinks = document.querySelectorAll('.nav-links a');
        const bubble = document.getElementById('navBubble');

        function updateBubble(el) {
            bubble.style.width = `${el.offsetWidth}px`;
            bubble.style.left = `${el.offsetLeft}px`;
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        const activeLink = document.querySelector('.nav-links a.active');
        if (activeLink) {
            updateBubble(activeLink);
            document.title = activeLink.textContent;
        }

        navLinks.forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                document.body.className = link.dataset.theme;
                navLinks.forEach(item => item.classList.remove('active'));
                link.classList.add('active');
                updateBubble(link);
                document.title = link.textContent;
            });
        });

        window.addEventListener('resize', () => {
            const current = document.querySelector('.nav-links a.active');
            if (current) updateBubble(current);
        });
    </script>
</body>
</html>
